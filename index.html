<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,maximum-scale=1.0">

<title>SHOHIN ROHNAMO</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;

    font-family:
        Arial,
        sans-serif;

    background:#06120b;
    color:#fff;
}

button,
input{
    font-family:inherit;
}

button{
    cursor:pointer;
}

/* =====================================================
   APP
===================================================== */

#app{
    position:fixed;
    inset:0;
    overflow:hidden;
}


/* =====================================================
   OFFLINE MAP
===================================================== */

#map{
    position:absolute;
    inset:0;
    overflow:hidden;

    background:
        radial-gradient(
            circle at 50% 50%,
            #183b26 0%,
            #0c2115 45%,
            #06120b 100%
        );
}


/*
    LOCAL MAP CANVAS

    В будущем сюда будут
    загружаться настоящие GeoJSON.
*/

#mapWorld{

    position:absolute;

    width:1600px;
    height:1200px;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%)
        scale(1);

    transform-origin:center;

    transition:
        transform .25s ease;

}


/* =====================================================
   MAP BACKGROUND
===================================================== */

.map-grid{

    position:absolute;

    inset:0;

    opacity:.35;

    background-image:

        linear-gradient(
            rgba(255,255,255,.035) 1px,
            transparent 1px
        ),

        linear-gradient(
            90deg,
            rgba(255,255,255,.035) 1px,
            transparent 1px
        );

    background-size:
        50px 50px;

}


/* =====================================================
   TERRITORY
===================================================== */

.city{

    position:absolute;

    left:180px;
    top:130px;

    width:1240px;
    height:900px;

    border-radius:45%;

    background:
        rgba(35,78,49,.20);

    border:
        2px solid
        rgba(98,255,171,.10);

}


/* =====================================================
   DISTRICTS
===================================================== */

.district{

    position:absolute;

    border-radius:24px;

    background:
        rgba(
            72,
            125,
            87,
            .18
        );

    border:
        1px solid
        rgba(
            142,
            205,
            156,
            .10
        );

}


.district span{

    position:absolute;

    left:18px;
    top:15px;

    color:
        rgba(
            255,
            255,
            255,
            .32
        );

    font-size:13px;

    font-weight:bold;

    letter-spacing:1px;

}


.d1{

    width:330px;
    height:250px;

    left:260px;
    top:180px;

}


.d2{

    width:350px;
    height:270px;

    left:650px;
    top:170px;

}


.d3{

    width:330px;
    height:260px;

    left:1010px;
    top:350px;

}


.d4{

    width:360px;
    height:270px;

    left:260px;
    top:610px;

}


.d5{

    width:360px;
    height:250px;

    left:720px;
    top:700px;

}


/* =====================================================
   ROADS
===================================================== */

.road{

    position:absolute;

    height:7px;

    border-radius:20px;

    background:
        #53685a;

    box-shadow:
        0 0 0 1px
        rgba(0,0,0,.2);

}


.road.main{

    height:13px;

    background:
        #77877c;

}


.r1{

    width:1250px;

    left:170px;
    top:490px;

    transform:
        rotate(-8deg);

}


.r2{

    width:1150px;

    left:220px;
    top:650px;

    transform:
        rotate(15deg);

}


.r3{

    width:900px;

    left:360px;
    top:340px;

    transform:
        rotate(32deg);

}


.r4{

    width:950px;

    left:280px;
    top:790px;

    transform:
        rotate(-27deg);

}


.r5{

    width:700px;

    left:520px;
    top:500px;

    transform:
        rotate(72deg);

}


.r6{

    width:620px;

    left:300px;
    top:570px;

    transform:
        rotate(-59deg);

}


.r7{

    width:600px;

    left:720px;
    top:370px;

    transform:
        rotate(80deg);

}


/* =====================================================
   ROUTE
===================================================== */

.route{

    position:absolute;

    height:9px;

    background:
        #39df89;

    border-radius:20px;

    box-shadow:
        0 0 20px
        rgba(
            57,
            223,
            137,
            .55
        );

    z-index:20;

}


.route1{

    width:420px;

    left:310px;
    top:535px;

    transform:
        rotate(-8deg);

}


.route2{

    width:230px;

    left:720px;
    top:475px;

    transform:
        rotate(57deg);

}


/* =====================================================
   STOP
===================================================== */

.stop{

    position:absolute;

    width:36px;
    height:36px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:50%;

    background:
        #39df89;

    border:
        4px solid
        #eafff3;

    color:
        #031008;

    font-size:13px;

    font-weight:900;

    box-shadow:
        0 5px 22px
        rgba(0,0,0,.55);

    z-index:50;

    transition:
        transform .2s,
        box-shadow .2s;

}


.stop:hover{

    transform:
        scale(1.18);

}


.stop.selected{

    box-shadow:

        0 0 0 9px
        rgba(
            57,
            223,
            137,
            .16
        ),

        0 5px 25px
        rgba(0,0,0,.6);

}


.stop-name{

    position:absolute;

    left:42px;
    top:5px;

    white-space:nowrap;

    padding:
        6px 9px;

    border-radius:8px;

    background:
        rgba(
            5,
            15,
            9,
            .92
        );

    color:white;

    font-size:9px;

}


/* =====================================================
   TOP
===================================================== */

.top{

    position:fixed;

    top:12px;

    left:12px;
    right:12px;

    z-index:500;

    display:flex;

    gap:8px;

}


.logo{

    width:48px;
    height:48px;

    flex:none;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:16px;

    background:

        linear-gradient(
            145deg,
            #62ffab,
            #0a9b57
        );

    color:#031008;

    font-size:22px;

    font-weight:900;

    box-shadow:
        0 8px 30px
        rgba(0,0,0,.4);

}


.search{

    flex:1;

    height:48px;

    display:flex;

    align-items:center;

    padding:
        5px 6px 5px 14px;

    border-radius:16px;

    background:
        rgba(
            5,
            15,
            9,
            .94
        );

    border:
        1px solid
        rgba(
            255,
            255,
            255,
            .1
        );

    backdrop-filter:
        blur(20px);

}


.search input{

    flex:1;

    min-width:0;

    border:0;
    outline:0;

    background:
        transparent;

    color:white;

    font-size:12px;

}


.search input::placeholder{

    color:#78857e;

}


.search button{

    width:38px;
    height:38px;

    border:0;

    border-radius:12px;

    background:
        #39df89;

    color:#031008;

    font-size:17px;

}


/* =====================================================
   ROUTE PANEL
===================================================== */

.route-panel{

    position:fixed;

    top:70px;

    left:12px;
    right:12px;

    z-index:500;

    padding:12px;

    border-radius:20px;

    background:
        rgba(
            5,
            15,
            9,
            .95
        );

    border:
        1px solid
        rgba(
            255,
            255,
            255,
            .1
        );

    backdrop-filter:
        blur(20px);

}


.field{

    display:flex;

    align-items:center;

    gap:8px;

    padding:9px;

    margin-bottom:6px;

    border-radius:12px;

    background:
        #0d1d12;

}


.field span{

    width:48px;

    color:#718078;

    font-size:8px;

}


.field input{

    flex:1;

    min-width:0;

    border:0;
    outline:0;

    background:
        transparent;

    color:white;

    font-size:10px;

}


.dot{

    width:9px;
    height:9px;

    border-radius:50%;

    background:
        #39df89;

}


.dot.red{

    background:
        #ff5964;

}


.find{

    width:100%;

    padding:12px;

    border:0;

    border-radius:12px;

    background:
        #39df89;

    color:#031008;

    font-size:10px;

    font-weight:900;

}


/* =====================================================
   CONTROLS
===================================================== */

.controls{

    position:fixed;

    right:12px;

    bottom:125px;

    z-index:500;

    display:flex;

    flex-direction:column;

    gap:7px;

}


.control{

    width:48px;
    height:48px;

    border:
        1px solid
        rgba(
            255,
            255,
            255,
            .1
        );

    border-radius:15px;

    background:
        rgba(
            5,
            15,
            9,
            .95
        );

    color:#39df89;

    font-size:20px;

}


/* =====================================================
   LAYERS
===================================================== */

.layers{

    position:fixed;

    right:12px;

    top:135px;

    z-index:500;

    display:flex;

    flex-direction:column;

    gap:7px;

}


.layer{

    width:48px;
    height:42px;

    border:
        1px solid
        rgba(
            255,
            255,
            255,
            .1
        );

    border-radius:13px;

    background:
        rgba(
            5,
            15,
            9,
            .95
        );

    color:#a8b3ad;

    font-size:9px;

}


.layer.active{

    background:
        #39df89;

    color:#031008;

}


/* =====================================================
   RESULT
===================================================== */

.result{

    position:fixed;

    left:12px;
    right:12px;

    bottom:12px;

    z-index:600;

    display:none;

    max-height:42vh;

    overflow:auto;

    padding:14px;

    border-radius:20px;

    background:
        rgba(
            5,
            15,
            9,
            .97
        );

    border:
        1px solid
        rgba(
            255,
            255,
            255,
            .1
        );

    backdrop-filter:
        blur(25px);

}


.result h2{

    font-size:15px;

}


.result p{

    margin-top:5px;

    color:#88958e;

    font-size:9px;

}


.route-card{

    margin-top:12px;

    padding:12px;

    border-radius:14px;

    background:
        #0d1d12;

}


.route-number{

    color:#39df89;

    font-size:18px;

    font-weight:900;

}


.route-stop{

    display:flex;

    align-items:center;

    gap:9px;

    padding:8px 0;

    font-size:9px;

}


.route-dot{

    width:12px;
    height:12px;

    flex:none;

    border-radius:50%;

    background:
        #39df89;

}


/* =====================================================
   BOTTOM
===================================================== */

.bottom{

    position:fixed;

    left:12px;
    right:12px;

    bottom:12px;

    z-index:450;

    padding:11px;

    border-radius:18px;

    background:
        rgba(
            5,
            15,
            9,
            .95
        );

    border:
        1px solid
        rgba(
            255,
            255,
            255,
            .1
        );

    backdrop-filter:
        blur(20px);

}


.bottom-row{

    display:flex;

    align-items:center;

    gap:10px;

}


.status-icon{

    width:38px;
    height:38px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:12px;

    background:
        #12331f;

}


.status{

    flex:1;

}


.status small{

    display:block;

    color:#718078;

    font-size:7px;

    letter-spacing:1px;

}


.status strong{

    display:block;

    margin-top:3px;

    font-size:10px;

}


.offline{

    padding:
        8px 9px;

    border-radius:10px;

    background:
        #12331f;

    color:
        #39df89;

    font-size:7px;

    font-weight:bold;

}


/* =====================================================
   TOAST
===================================================== */

#toast{

    position:fixed;

    left:50%;
    top:50%;

    z-index:9999;

    transform:
        translate(-50%,-50%)
        scale(.9);

    opacity:0;

    padding:
        12px 18px;

    border-radius:14px;

    background:
        #effff5;

    color:
        #031008;

    font-size:10px;

    font-weight:bold;

    pointer-events:none;

    transition:.25s;

}


#toast.show{

    opacity:1;

    transform:
        translate(-50%,-50%)
        scale(1);

}


/* =====================================================
   DESKTOP
===================================================== */

@media(min-width:700px){

    .top,
    .route-panel{

        width:430px;

        right:auto;

    }


    .result{

        width:430px;

        right:auto;

    }

}

</style>
</head>


<body>

<script>

/* =====================================================
   OFFLINE DATABASE
===================================================== */


/*
    В дальнейшем эти данные
    будут заменены на:

    data/stops.geojson
    data/routes.geojson
*/


const stops = [

    {
        id:"s1",
        name:"Корвон"
    },


    {
        id:"s2",
        name:"Садриддин Айни"
    },


    {
        id:"s3",
        name:"Центр"
    },


    {
        id:"s4",
        name:"Площадь Сомони"
    },


    {
        id:"s5",
        name:"Аэропорт"
    }

];


const routes = [

    {

        id:"route1",

        number:"1",

        name:
        "Корвон — Центр — Аэропорт",

        stops:[
            "s1",
            "s2",
            "s3",
            "s4",
            "s5"
        ]

    }

];


/* =====================================================
   ZOOM
===================================================== */

let zoom = 1;


function updateZoom(){

    document
        .getElementById("mapWorld")
        .style.transform =
        `
        translate(-50%,-50%)
        scale(${zoom})
        `;

}


function zoomIn(){

    zoom =
        Math.min(
            zoom + .15,
            2.5
        );

    updateZoom();

}


function zoomOut(){

    zoom =
        Math.max(
            zoom - .15,
            .65
        );

    updateZoom();

}


function resetMap(){

    zoom = 1;

    updateZoom();

    toast(
        "Карта сброшена"
    );

}


/* =====================================================
   SEARCH
===================================================== */

function search(){

    const value =
        document
        .getElementById("search")
        .value
        .trim()
        .toLowerCase();


    if(!value){

        toast(
            "Введите название"
        );

        return;
    }


    const stop =
        stops.find(
            s =>
            s.name
            .toLowerCase()
            .includes(value)
        );


    if(stop){

        selectStop(
            stop.name
        );

        return;
    }


    toast(
        "В офлайн-базе пока нет этого объекта"
    );

}


/* =====================================================
   SELECT STOP
===================================================== */

function selectStop(
    name
){

    document
        .getElementById("search")
        .value =
        name;


    document
        .querySelectorAll(".stop")
        .forEach(
            element => {

                element.classList.remove(
                    "selected"
                );

                if(
                    element.dataset.name
                    === name
                ){

                    element.classList.add(
                        "selected"
                    );

                }

            }
        );


    toast(
        "📍 " + name
    );

}


/* =====================================================
   SHOW STOPS
===================================================== */

function showAllStops(){

    document
        .querySelectorAll(".stop")
        .forEach(
            s =>
            s.style.display =
            "flex"
        );


    toast(
        "Остановки показаны"
    );

}


/* =====================================================
   FIND ROUTE
===================================================== */

function findRoute(){

    const from =
        document
        .getElementById("from")
        .value
        .trim()
        .toLowerCase();


    const to =
        document
        .getElementById("to")
        .value
        .trim()
        .toLowerCase();


    if(!from || !to){

        toast(
            "Укажите откуда и куда"
        );

        return;
    }


    const fromStop =
        stops.find(
            s =>
            s.name
            .toLowerCase()
            .includes(from)
        );


    const toStop =
        stops.find(
            s =>
            s.name
            .toLowerCase()
            .includes(to)
        );


    if(
        !fromStop ||
        !toStop
    ){

        toast(
            "Остановка не найдена"
        );

        return;
    }


    const route =
        routes.find(
            r =>
            r.stops.includes(
                fromStop.id
            )
            &&
            r.stops.includes(
                toStop.id
            )
        );


    if(!route){

        toast(
            "Маршрут не найден"
        );

        return;
    }


    const fromIndex =
        route.stops.indexOf(
            fromStop.id
        );


    const toIndex =
        route.stops.indexOf(
            toStop.id
        );


    let sequence;


    if(
        fromIndex <= toIndex
    ){

        sequence =
            route.stops.slice(
                fromIndex,
                toIndex + 1
            );

    }else{

        sequence =
            route.stops.slice(
                toIndex,
                fromIndex + 1
            )
            .reverse();

    }


    showRoute(
        route,
        sequence
    );

}


/* =====================================================
   RESULT
===================================================== */

function showRoute(
    route,
    sequence
){

    const result =
        document
        .getElementById("result");


    const html =
        sequence
        .map(
            (id,index) => {

                const stop =
                    stops.find(
                        s =>
                        s.id === id
                    );


                return `

                    <div
                        class="route-stop">

                        <div
                            class="route-dot">
                        </div>

                        ${index + 1}.
                        ${stop.name}

                    </div>

                `;

            }
        )
        .join("");


    result.innerHTML = `

        <h2>
            🚌 Маршрут найден
        </h2>

        <p>
            Полностью локальный
            расчёт.
        </p>


        <div class="route-card">

            <div class="route-number">

                №${route.number}

            </div>


            <p>

                ${route.name}

            </p>


            ${html}

        </div>

    `;


    result.style.display =
        "block";

}


/* =====================================================
   MAP LAYER
===================================================== */

function setLayer(
    type
){

    const mapButton =
        document
        .getElementById("mapLayer");


    const satButton =
        document
        .getElementById("satLayer");


    if(
        type === "sat"
    ){

        /*
            Настоящая спутниковая карта
            будет подключена позже
            локальными тайлами.

            Сейчас показываем
            offline-заглушку.
        */

        mapButton.classList.remove(
            "active"
        );

        satButton.classList.add(
            "active"
        );


        document
            .getElementById("map")
            .style.background =
            `
            radial-gradient(
                circle at 50% 50%,
                #34372f,
                #171914 65%,
                #090a08
            )
            `;


        toast(
            "🛰️ Спутниковый режим подготовлен"
        );

    }else{

        satButton.classList.remove(
            "active"
        );

        mapButton.classList.add(
            "active"
        );


        document
            .getElementById("map")
            .style.background =
            `
            radial-gradient(
                circle at 50% 50%,
                #183b26,
                #0c2115 45%,
                #06120b
            )
            `;


        toast(
            "🗺️ Режим карты"
        );

    }

}


/* =====================================================
   TOAST
===================================================== */

let toastTimer;


function toast(
    text
){

    const element =
        document
        .getElementById("toast");


    element.textContent =
        text;


    element.classList.add(
        "show"
    );


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(
            () => {

                element.classList.remove(
                    "show"
                );

            },
            2000
        );

}


/* =====================================================
   GEOJSON LOADER
===================================================== */


/*
    КОГДА СОЗДАДИМ ПАПКУ data,
    приложение сможет загружать:

        data/dushanbe.geojson
        data/roads.geojson
        data/districts.geojson
        data/places.geojson
        data/stops.geojson
        data/routes.geojson

    Ничего менять в интерфейсе
    для этого не понадобится.
*/


async function loadGeoJSON(
    file
){

    try{

        const response =
            await fetch(file);


        if(
            !response.ok
        ){

            throw new Error(
                "File not found"
            );

        }


        const data =
            await response.json();


        console.log(
            "GeoJSON loaded:",
            file,
            data
        );


        return data;

    }catch(error){

        console.log(
            "GeoJSON пока отсутствует:",
            file
        );


        return null;

    }

}
