<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b8f4d">
<title>SHOHIN ROHNAMO</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
:root{
 --green:#0b8f4d;
 --green2:#18b866;
 --dark:#07110b;
 --text:#142019;
 --muted:#748078;
 --white:#fff;
 --panel:rgba(255,255,255,.96);
 --shadow:0 12px 35px rgba(0,0,0,.15);
}

*{
 box-sizing:border-box;
 margin:0;
 padding:0;
 font-family:Arial,Helvetica,sans-serif;
}

body{
 background:#edf5ef;
 color:var(--text);
 overflow-x:hidden;
}

button,input{
 font:inherit;
}

button{
 cursor:pointer;
 border:0;
}

#loader{
 position:fixed;
 inset:0;
 z-index:99999;
 background:linear-gradient(145deg,#064a2a,#0b8f4d,#18b866);
 display:flex;
 flex-direction:column;
 justify-content:center;
 align-items:center;
 color:white;
 transition:.5s;
}

#loader.hide{
 opacity:0;
 pointer-events:none;
}

.loaderLogo{
 font-size:50px;
 font-weight:1000;
 letter-spacing:4px;
}

.loaderName{
 margin-top:7px;
 letter-spacing:3px;
 font-size:11px;
}

.loaderBar{
 width:170px;
 height:4px;
 background:rgba(255,255,255,.3);
 border-radius:10px;
 margin-top:22px;
 overflow:hidden;
}

.loaderBar span{
 display:block;
 width:100%;
 height:100%;
 background:white;
 animation:load 1s;
}

@keyframes load{
 from{width:0}
 to{width:100%}
}

/* MAP */

#map{
 position:fixed;
 inset:0;
 z-index:1;
}

.leaflet-control-attribution{
 font-size:8px!important;
}

/* TOP */

.top{
 position:fixed;
 top:0;
 left:0;
 right:0;
 z-index:1000;
 padding:12px;
 pointer-events:none;
}

.topbar{
 max-width:760px;
 margin:auto;
 display:flex;
 justify-content:space-between;
 align-items:center;
}

.logo{
 pointer-events:auto;
 display:flex;
 align-items:center;
 gap:9px;
 padding:8px 12px;
 background:rgba(255,255,255,.94);
 backdrop-filter:blur(15px);
 border-radius:17px;
 box-shadow:var(--shadow);
}

.logoMark{
 width:40px;
 height:40px;
 border-radius:12px;
 display:flex;
 justify-content:center;
 align-items:center;
 color:white;
 background:linear-gradient(145deg,#087a42,#18b866);
 font-size:15px;
 font-weight:1000;
}

.logoText b{
 display:block;
 font-size:13px;
}

.logoText small{
 color:#7b867f;
 font-size:8px;
 letter-spacing:1.8px;
}

.menuBtn{
 pointer-events:auto;
 width:46px;
 height:46px;
 border-radius:15px;
 background:rgba(255,255,255,.96);
 box-shadow:var(--shadow);
 font-size:21px;
}

/* GPS */

.gps{
 position:fixed;
 z-index:1000;
 right:15px;
 bottom:275px;
 width:50px;
 height:50px;
 border-radius:17px;
 background:white;
 box-shadow:var(--shadow);
 color:var(--green);
 font-size:22px;
}

/* BOTTOM PANEL */

.bottom{
 position:fixed;
 z-index:900;
 left:0;
 right:0;
 bottom:0;
 padding:10px;
 pointer-events:none;
}

.panel{
 max-width:650px;
 margin:auto;
 pointer-events:auto;
 background:var(--panel);
 backdrop-filter:blur(18px);
 border-radius:25px 25px 0 0;
 padding:12px;
 box-shadow:0 -10px 35px rgba(0,0,0,.12);
}

/* SEARCH */

.search{
 height:52px;
 display:flex;
 align-items:center;
 gap:8px;
 border-radius:16px;
 background:#f1f5f2;
 padding:0 8px 0 15px;
}

.search span{
 font-size:19px;
}

.search input{
 flex:1;
 border:0;
 outline:0;
 background:transparent;
 font-size:15px;
}

.search button{
 width:40px;
 height:40px;
 border-radius:13px;
 color:white;
 background:var(--green);
}

/* ROUTE */

.routeBox{
 margin-top:8px;
 display:none;
 background:#f6faf7;
 border-radius:17px;
 padding:8px;
}

.routeBox.show{
 display:block;
}

.point{
 display:flex;
 align-items:center;
 gap:9px;
 height:42px;
}

.dot{
 width:27px;
 height:27px;
 border-radius:50%;
 display:flex;
 align-items:center;
 justify-content:center;
 color:white;
 font-size:11px;
 font-weight:bold;
 background:var(--green);
}

.point input{
 flex:1;
 border:0;
 outline:0;
 background:transparent;
 font-size:13px;
}

.point button{
 background:#e5f3e9;
 color:var(--green);
 border-radius:10px;
 padding:7px 10px;
 font-size:11px;
 font-weight:bold;
}

.transport{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:6px;
 margin-top:7px;
}

.transport button{
 padding:10px;
 border-radius:12px;
 background:#e9f4ec;
 color:#42604e;
 font-size:12px;
 font-weight:bold;
}

.transport button.active{
 color:white;
 background:var(--green);
}

.build{
 width:100%;
 margin-top:7px;
 padding:14px;
 border-radius:14px;
 background:linear-gradient(145deg,#087b42,#18b866);
 color:white;
 font-weight:900;
}

/* INFO */

.info{
 display:none;
 margin-top:8px;
 border-radius:16px;
 background:white;
 padding:13px;
 box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.info.show{
 display:block;
}

.infoTop{
 display:flex;
 justify-content:space-between;
 align-items:center;
}

.infoTime{
 font-size:24px;
 font-weight:900;
}

.infoDistance{
 color:var(--muted);
 font-size:12px;
}

.infoLine{
 margin-top:10px;
 height:4px;
 border-radius:10px;
 background:linear-gradient(90deg,var(--green),#8dd5a9);
}

.startNav{
 width:100%;
 margin-top:10px;
 padding:13px;
 border-radius:13px;
 background:var(--green);
 color:white;
 font-weight:bold;
}

/* QUICK */

.quick{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:6px;
 margin-top:8px;
}

.quick button{
 background:white;
 border-radius:14px;
 padding:9px 3px;
 color:#52635a;
 font-size:10px;
 box-shadow:0 3px 12px rgba(0,0,0,.06);
}

.quick button span{
 display:block;
 font-size:19px;
 margin-bottom:3px;
}

/* SIDE MENU */

.overlay{
 position:fixed;
 inset:0;
 z-index:5000;
 background:rgba(0,0,0,.45);
 display:none;
}

.overlay.show{
 display:block;
}

.menu{
 position:fixed;
 z-index:6000;
 top:0;
 right:-380px;
 width:350px;
 max-width:90%;
 height:100%;
 background:white;
 padding:15px;
 overflow:auto;
 transition:.3s;
 box-shadow:-15px 0 40px rgba(0,0,0,.25);
}

.menu.open{
 right:0;
}

.menuHead{
 padding:22px;
 border-radius:22px;
 color:white;
 background:linear-gradient(145deg,#075d35,#0b8f4d,#18b866);
 margin-bottom:10px;
}

.menuHead strong{
 font-size:28px;
}

.menuHead small{
 display:block;
 margin-top:5px;
 opacity:.8;
}

.closeMenu{
 float:right;
 width:36px;
 height:36px;
 border-radius:11px;
}

.menuItem{
 width:100%;
 padding:14px;
 margin:4px 0;
 border-radius:14px;
 text-align:left;
 background:white;
 font-weight:bold;
 color:#233229;
}

.menuItem:hover{
 background:#eaf7ee;
}

.menuItem span{
 display:inline-block;
 width:32px;
}

/* MODAL */

.modal{
 position:fixed;
 z-index:9000;
 inset:0;
 display:none;
 align-items:flex-end;
 background:rgba(0,0,0,.55);
 padding:10px;
}

.modal.show{
 display:flex;
}

.modalBox{
 width:700px;
 max-width:100%;
 max-height:90vh;
 overflow:auto;
 margin:auto;
 background:white;
 border-radius:25px;
 padding:18px;
}

.modalHead{
 display:flex;
 justify-content:space-between;
 align-items:center;
 margin-bottom:15px;
}

.close{
 width:38px;
 height:38px;
 border-radius:12px;
 background:#edf3ef;
}

.modalBtn{
 width:100%;
 padding:13px;
 border-radius:13px;
 background:var(--green);
 color:white;
 font-weight:bold;
 margin-top:10px;
}

/* PAGES */

.page{
 display:none;
 position:fixed;
 inset:0;
 z-index:3000;
 background:#edf5ef;
 overflow:auto;
 padding:80px 15px 30px;
}

.page.active{
 display:block;
}

.pageInner{
 max-width:900px;
 margin:auto;
}

.hero{
 padding:22px;
 border-radius:24px;
 color:white;
 background:linear-gradient(145deg,#075d35,#0b8f4d,#18b866);
 margin-bottom:14px;
}

.hero h1{
 font-size:27px;
}

.hero p{
 margin-top:7px;
 opacity:.85;
}

.card{
 background:white;
 border-radius:20px;
 padding:17px;
 margin-bottom:12px;
 box-shadow:0 7px 25px rgba(0,0,0,.08);
}

.btn{
 border:0;
 padding:13px 16px;
 border-radius:13px;
 color:white;
 background:var(--green);
 font-weight:bold;
}

.full{
 width:100%;
}

.grid{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
 gap:12px;
}

.photo{
 width:100%;
 height:180px;
 object-fit:cover;
 border-radius:15px;
}

.muted{
 color:var(--muted);
 line-height:1.5;
}

.badge{
 display:inline-block;
 margin:5px 3px 0 0;
 padding:6px 9px;
 border-radius:9px;
 background:#e7f6eb;
 color:var(--green);
 font-size:11px;
 font-weight:bold;
}

/* FORMS */

.field{
 margin-bottom:13px;
}

.field label{
 display:block;
 font-size:12px;
 font-weight:bold;
 margin-bottom:6px;
}

.field input,
.field textarea,
.field select{
 width:100%;
 padding:13px;
 border:1px solid #d6e4da;
 border-radius:12px;
 outline:0;
 background:white;
}

.field textarea{
 min-height:100px;
 resize:vertical;
}

/* DARK */

body.dark{
 background:#07110b;
 color:white;
}

body.dark .page{
 background:#07110b;
}

body.dark .logo,
body.dark .menu,
body.dark .panel,
body.dark .gps,
body.dark .card,
body.dark .modalBox,
body.dark .quick button{
 background:#132018;
 color:white;
}

body.dark .search,
body.dark .routeBox{
 background:#18271e;
}

body.dark .point input{
 color:white;
}

body.dark .menuItem{
 background:#132018;
 color:white;
}

body.dark .field input,
body.dark .field textarea,
body.dark .field select{
 background:#18271e;
 color:white;
 border-color:#2a4232;
}

@media(min-width:800px){

 .bottom{
  bottom:25px;
 }

 .panel{
  border-radius:25px;
 }

 .gps{
  bottom:330px;
 }

}

@media(max-width:500px){

 .logoText{
  display:none;
 }

 .gps{
  bottom:300px;
 }

 .menu{
  width:330px;
 }

}
</style>
</head>

<body>

<div id="loader">
 <div class="loaderLogo">SHT</div>
 <div class="loaderName">SHOHIN ROHNAMO</div>
 <div class="loaderBar"><span></span></div>
</div>

<div id="map"></div>

<header class="top">

 <div class="topbar">

  <div class="logo">

   <div class="logoMark">SHT</div>

   <div class="logoText">
    <b>SHOHIN ROHNAMO</b>
    <small>TAJIKISTAN NAVIGATION</small>
   </div>

  </div>

  <button class="menuBtn" onclick="openMenu()">☰</button>

 </div>

</header>

<button class="gps" onclick="gps()">⦿</button>

<!-- MAIN PANEL -->

<div class="bottom">

 <div class="panel">

  <div class="search">

   <span>🔎</span>

   <input
    id="search"
    placeholder="Куда едем?"
    onkeydown="if(event.key==='Enter')searchPlace()">

   <button onclick="searchPlace()">➜</button>

  </div>

  <div id="routeBox" class="routeBox">

     readonly

    <button onclick="chooseA()">

    </button>

   </div>

    <div class="dot">B</div>

    <input

     readonly
     placeholder="Куда?">

     Карта
    </button>

   </div>

   <div class="transport">

    <button
     id="carBtn"
     class="active"
     onclick="setTransport('car')">
     🚗 Авто
    </button>

    <button

    Роҳҳо

   <button onclick="openAddStop()">
    <span>➕</span>
    Илова

  </div>

 </div>

</div>

<!-- SIDE MENU -->

<div id="overlay" class="overlay" onclick="closeMenu()"></div>

<aside id="menu" class="menu">

 <div class="menuHead">

  <button class="closeMenu" onclick="closeMenu()">
   ✕
  </button>

  <strong>SHT</strong>

  <small>
   SHOHIN ROHNAMO
  </small>

 </div>

 <button class="menuItem" onclick="home()">
  <span>🏠</span> Главная
 </button>

 <button class="menuItem" onclick="openNavigation()">
  <span>🧭</span> Навигация
 </button>

 <button class="menuItem" onclick="openRoutes()">
  <span>🚌</span> Маршруты
 </button>

 <button class="menuItem" onclick="openStops()">
  <span>🚏</span> Остановки
 </button>

 <button class="menuItem" onclick="openPlaces()">

  <span>➕</span> Добавить остановку

<!-- PAGE -->

<!-- MODAL -->

 <div class="modalBox">

  <div class="modalHead">
   <h2 id="modalTitle">Информация</h2>

    ✕
   </button>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* ============================
   MAP
============================ */

let map=L.map("map",{
 zoomControl:false
}).setView(
 [38.5598,68.7870],
 13
);

L.tileLayer(
 "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
 {
  maxZoom:19,
  attribution:"© OpenStreetMap"
 }
).addTo(map);


/* ============================
   VARIABLES
============================ */

let A=null;
let B=null;

let markerA=null;
let markerB=null;

let route=null;

let selecting=null;

let transport="car";

let navigationMode=false;


/* ============================
   STOPS
============================ */

const stops=[

 {
  name:"Площадь Исмоили Сомони",
  lat:38.5736,
  lng:68.7864,
  buses:"1, 2, 8",
  minibuses:"7, 11"
 },

 {
  name:"Центр Душанбе",
  lat:38.5598,
  lng:68.7870,
  buses:"2, 18",
  minibuses:"33"
 }

];

stops.forEach((s,index)=>{

 let m=L.circleMarker(
  [s.lat,s.lng],
  {
   radius:8,
   color:"#087b42",
   fillColor:"#18b866",
   fillOpacity:1,
   weight:3
  }
 ).addTo(map);

 m.bindPopup(`
  <b>🚏 ${s.name}</b><br><br>

  🚌 ${s.buses}<br>
  🚐 ${s.minibuses}<br><br>

  <button
   onclick="routeToStop(${index})"
   style="
    border:0;
    padding:9px 13px;
    border-radius:10px;
    background:#0b8f4d;
    color:white;
    font-weight:bold">
   🧭 Маршрут
  </button>
 `);

});


/* ============================
   MAP CLICK
============================ */

map.on("click",function(e){

 if(selecting==="A"){
  setA(e.latlng);
 }

 if(selecting==="B"){
  setB(e.latlng);
 }

});


/* ============================
   CHOOSE A
============================ */

function chooseA(){

 selecting="A";

 showRouteBox();

 alert(
  "Нажмите на карте точку отправления A."
 );

}


/* ============================
   CHOOSE B
============================ */

function chooseB(){

 selecting="B";

 showRouteBox();

 alert(
  "Нажмите на карте точку назначения B."
 );

}


/* ============================
   SET A
============================ */

function setA(pos){

 A=pos;

 if(markerA)
  map.removeLayer(markerA);

 markerA=L.marker(pos)
  .addTo(map)
  .bindPopup("🟢 Точка A")
  .openPopup();

 document.getElementById("aInput")
  .value=
   pos.lat.toFixed(5)+
   ", "+
   pos.lng.toFixed(5);

 selecting=null;

}


/* ============================
   SET B
============================ */

function setB(pos){

 B=pos;

 if(markerB)
  map.removeLayer(markerB);

 markerB=L.marker(pos)
  .addTo(map)
  .bindPopup("🔴 Точка B")
  .openPopup();

 document.getElementById("bInput")
  .value=
   pos.lat.toFixed(5)+
   ", "+
   pos.lng.toFixed(5);

 selecting=null;

}


/* ============================
   REAL ROUTE
============================ */

async function buildRoute(){

 if(!A || !B){

  alert(
   "Сначала выберите точки A и B."
  );

  return;
 }

 const profile=
  transport==="foot"
   ?"foot"
   :
   transport==="bike"
    ?"bike"
    :"car";

 const url=
 `https://router.project-osrm.org/route/v1/${profile}/`+
 `${A.lng},${A.lat};${B.lng},${B.lat}`+
 `?overview=full&geometries=geojson&steps=true`;

 try{

  document.getElementById("time")
   .textContent="...";

  document.getElementById("distance")
   .textContent="...";

  const response=
   await fetch(url);

  if(!response.ok)
   throw new Error();

  const data=
   await response.json();

  if(
   data.code!=="Ok" ||
   !data.routes ||
   !data.routes.length
  ){

   throw new Error();

  }

  const r=data.routes[0];

  if(route)
   map.removeLayer(route);

  route=L.geoJSON(
   r.geometry,
   {
    style:{
     color:"#0b8f4d",
     weight:7,
     opacity:.95
    }
   }
  ).addTo(map);

  map.fitBounds(
   route.getBounds(),
   {
    padding:[80,160]
   }
  );

  const km=
   (r.distance/1000).toFixed(1);

  const min=
   Math.round(r.duration/60);

  document.getElementById("distance")
   .textContent=km+" км";

  document.getElementById("time")
   .textContent=min+" мин";

  document.getElementById("info")
   .classList.add("show");

 }catch(e){

  alert(
   "Не удалось построить маршрут. Проверьте интернет и попробуйте ещё раз."
  );

 }

}


/* ============================
   TRANSPORT
============================ */

function setTransport(type){

 transport=type;

 document.getElementById("carBtn")
  .classList.remove("active");

 document.getElementById("walkBtn")
  .classList.remove("active");

 document.getElementById("bikeBtn")
  .classList.remove("active");

 if(type==="car")
  document.getElementById("carBtn")
   .classList.add("active");

 if(type==="foot")
  document.getElementById("walkBtn")
   .classList.add("active");

 if(type==="bike")
  document.getElementById("bikeBtn")
   .classList.add("active");

}


/* ============================
   GPS
============================ */

function gps(){

 if(!navigator.geolocation){

  alert("GPS недоступен.");
  return;

 }

 navigator.geolocation.getCurrentPosition(
  p=>{

   const pos={
    lat:p.coords.latitude,
    lng:p.coords.longitude
   };

   map.setView(
    [pos.lat,pos.lng],
    16
   );

   L.marker(pos)
    .addTo(map)
    .bindPopup("📍 Вы здесь")
    .openPopup();

  },
  ()=>{
   alert(
    "Разрешите доступ к геолокации."
   );
  },
  {
   enableHighAccuracy:true,
   timeout:10000
  }
 );

}


/* ============================

============================ */

function routeToStop(index){

 const s=stops[index];

 B={
  lat:s.lat,
  lng:s.lng
 };

 document.getElementById("bInput")
  .value=
   s.lat.toFixed(5)+
   ", "+
   s.lng.toFixed(5);

 showRouteBox();

 if(!A){

  gpsToA();

 }else{

  buildRoute();

 }

}


/* ============================
   GPS AS A
============================ */

function gpsToA(){

 if(!navigator.geolocation){

  alert("GPS недоступен.");
  return;

 }

 navigator.geolocation.getCurrentPosition(
  p=>{

   setA({
    lat:p.coords.latitude,
    lng:p.coords.longitude
   });

   buildRoute();

  },
  ()=>{
   alert(
    "Разрешите доступ к геолокации."
   );
  }
 );

}

function searchPlace(){

 const q=
  document.getElementById("search")
   .value
   .trim()
   .toLowerCase();

 if(!q)
  return;

 const stop=
  stops.find(s=>
   s.name.toLowerCase().includes(q)
  );

 if(stop){

  map.setView(
   [stop.lat,stop.lng],
   17
  );

  return;
 }

 alert(
  "Место не найдено. Можно выбрать точку B прямо на карте."
 );

 showRouteBox();

}

 );

 closePage();
