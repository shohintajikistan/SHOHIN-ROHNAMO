<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,viewport-fit=cover">

<title>SHOHIN ROHNAMO</title>

<link rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body,
#map{
    width:100%;
    height:100%;
}

body{
    overflow:hidden;
    font-family:Arial,sans-serif;
    background:#06120b;
    color:white;
}

/* =========================
   MAP
========================= */

#map{
    position:fixed;
    inset:0;
    z-index:1;
}

/* =========================
   TOP
========================= */

.top{
    position:fixed;
    top:12px;
    left:12px;
    right:12px;

    z-index:1000;

    display:flex;
    gap:8px;
}

.logo{
    width:48px;
    height:48px;

    flex:none;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:16px;

    background:
        linear-gradient(
            145deg,
            #62ffab,
            #0a9b57
        );

    color:#031008;

    font-size:22px;
    font-weight:900;

    box-shadow:
        0 8px 30px
        rgba(0,0,0,.45);
}

.search{
    flex:1;

    height:48px;

    display:flex;
    align-items:center;

    padding:
        5px
        6px
        5px
        14px;

    background:
        rgba(5,15,9,.95);

    border:
        1px solid
        rgba(255,255,255,.1);

    border-radius:16px;

    backdrop-filter:blur(20px);

    box-shadow:
        0 8px 30px
        rgba(0,0,0,.25);
}

.search input{
    flex:1;

    min-width:0;

    border:0;
    outline:0;

    background:transparent;

    color:#fff;

    font-size:12px;
}

.search input::placeholder{
    color:#718078;
}

.search button{
    width:38px;
    height:38px;

    border:0;

    border-radius:12px;

    background:#39df89;

    color:#031008;

    font-size:17px;

    cursor:pointer;
}

/* =========================
   MAIN PANEL
========================= */

.panel{
    position:fixed;

    top:70px;
    left:12px;
    right:12px;

    z-index:1000;

    padding:12px;

    background:
        rgba(5,15,9,.95);

    border:
        1px solid
        rgba(255,255,255,.1);

    border-radius:20px;

    backdrop-filter:blur(20px);

    box-shadow:
        0 10px 40px
        rgba(0,0,0,.3);
}

/* =========================
   STATUS
========================= */

.status{
    display:flex;
    align-items:center;

    gap:10px;
}

.status-icon{
    width:38px;
    height:38px;

    flex:none;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:13px;

    background:#12331f;

    font-size:18px;
}

.status-text{
    flex:1;
    min-width:0;
}

.status-text small{
    display:block;

    color:#718078;

    font-size:7px;

    letter-spacing:1.5px;
}

.status-text strong{
    display:block;

    margin-top:4px;

    color:#fff;

    font-size:10px;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.badge{
    flex:none;

    padding:
        8px
        10px;

    border-radius:11px;

    background:#12331f;

    color:#39df89;

    font-size:7px;

    font-weight:bold;
}

/* =========================
   BUTTONS
========================= */

.buttons{
    display:flex;

    gap:6px;

    margin-top:10px;
}

.buttons button{
    flex:1;

    min-width:0;

    padding:10px 5px;

    border:
        1px solid
        rgba(255,255,255,.08);

    border-radius:12px;

    background:#0d1d12;

    color:#9ca9a1;

    font-size:8px;

    font-weight:bold;

    cursor:pointer;

    transition:.2s;
}

.buttons button:active{
    transform:scale(.97);
}

.buttons button.active{
    background:#39df89;

    color:#031008;
}

/* =========================
   GPS
========================= */

.gps{
    position:fixed;

    right:13px;
    bottom:88px;

    z-index:1000;

    width:52px;
    height:52px;

    border:
        1px solid
        rgba(255,255,255,.1);

    border-radius:17px;

    background:
        rgba(5,15,9,.95);

    color:#39df89;

    font-size:24px;

    box-shadow:
        0 8px 25px
        rgba(0,0,0,.35);

    cursor:pointer;
}

.gps:active{
    transform:scale(.94);
}

/* =========================
   BOTTOM
========================= */

.bottom{
    position:fixed;

    left:12px;
    right:12px;
    bottom:12px;

    z-index:1000;

    padding:12px;

    border-radius:18px;

    background:
        rgba(5,15,9,.95);

    border:
        1px solid
        rgba(255,255,255,.1);

    backdrop-filter:blur(20px);
}

.bottom small{
    display:block;

    color:#718078;

    font-size:7px;

    letter-spacing:1px;
}

.bottom strong{
    display:block;

    margin-top:4px;

    color:#39df89;

    font-size:9px;
}

/* =========================
   TOAST
========================= */

#toast{
    position:fixed;

    top:190px;
    left:50%;

    z-index:9999;

    transform:
        translate(-50%,-10px);

    opacity:0;

    padding:
        10px
        15px;

    border-radius:13px;

    background:#effff5;

    color:#031008;

    font-size:9px;

    font-weight:bold;

    pointer-events:none;

    transition:.25s;
}

#toast.show{
    opacity:1;

    transform:
        translate(-50%,0);
}

/* =========================
   PLACE MARKER
========================= */

.place-marker{
    width:30px;
    height:30px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    background:#39df89;

    border:
        3px solid
        white;

    box-shadow:
        0 4px 15px
        rgba(0,0,0,.5);

    font-size:13px;
}

/* =========================
   LEAFLET
========================= */

.leaflet-control-zoom{
    margin-top:350px!important;
}

.leaflet-control-zoom a{
    background:
        rgba(5,15,9,.95)!important;

    color:#39df89!important;

    border:0!important;
}

.leaflet-control-attribution{
    background:
        rgba(5,15,9,.7)!important;

    color:#aaa!important;

    font-size:7px!important;
}

.leaflet-control-attribution a{
    color:#39df89!important;
}

/* =========================
   DESKTOP
========================= */

@media(min-width:700px){

    .top,
    .panel{
        width:430px;
        right:auto;
    }

    .top{
        left:20px;
    }

    .panel{
        left:20px;
    }

    .bottom{
        width:430px;

        left:20px;
        right:auto;
    }

}

</style>
</head>

<body>

<div id="map"></div>


<!-- =========================
     TOP
========================= -->

<div class="top">

    <div class="logo">
        S
    </div>

    <div class="search">

        <input
            id="search"
            type="search"
            autocomplete="off"
            placeholder="Найти объект или дорогу..."
            onkeydown="
                if(event.key==='Enter'){
                    searchMap();
                }
            "
        >

        <button
            onclick="searchMap()">
            🔎
        </button>

    </div>

</div>


<!-- =========================
     PANEL
========================= -->

<div class="panel">

    <div class="status">

        <div class="status-icon">
            🗺️
        </div>

        <div class="status-text">

            <small>
                SHOHIN ROHNAMO
            </small>

            <strong id="status">
                Загрузка данных...
            </strong>

        </div>

        <div
            id="badge"
            class="badge">

            LOAD

        </div>

    </div>


    <div class="buttons">

        <button
            id="roadsBtn"
            class="active"
            onclick="showRoads()">

            🛣️ ДОРОГИ

        </button>

        <button
            id="placesBtn"
            onclick="showPlaces()">

            📍 ОБЪЕКТЫ

        </button>

        <button
            onclick="locateMe()">

            ◎ GPS

        </button>

    </div>

</div>


<!-- =========================
     GPS
========================= -->

<button
    class="gps"
    onclick="locateMe()">

    ◎

</button>


<!-- =========================
     BOTTOM
========================= -->

<div class="bottom">

    <small>
        SHOHIN GREEN • DUSHANBE
    </small>

    <strong>
        Карта Душанбе
    </strong>

</div>


<div id="toast">
    Готово
</div>


<script
src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<script>

/* ==========================================
   CONFIG
========================================== */

const DUSHANBE = [
    38.5598,
    68.7870
];

const ROADS_FILE =
    "export(1).geojson";

const PLACES_FILE =
    "export(2).geojson";


/* ==========================================
   MAP
========================================== */

const map =
    L.map(
        "map",
        {
            center:DUSHANBE,

            zoom:13,

            minZoom:10,

            maxZoom:19,

            zoomControl:true
        }
    );


/* ==========================================
   BASE MAP
========================================== */

L.tileLayer(

    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

    {
        maxZoom:19,

        attribution:
        "&copy; OpenStreetMap contributors"
    }

).addTo(map);


/* ==========================================
   DATA
========================================== */

let roadsData = null;

let placesData = null;

let roadsLayer = null;

let placesLayer = null;

let gpsMarker = null;


/* ==========================================
   LOAD JSON
========================================== */

async function loadJSON(
    file
){

    const response =
        await fetch(
            file,
            {
                cache:"no-store"
            }
        );


    if(!response.ok){

        throw new Error(
            file +
            " HTTP " +
            response.status
        );

    }


    return await response.json();

}


/* ==========================================
   LOAD ROADS
========================================== */

async function loadRoads(){

    try{

        roadsData =
            await loadJSON(
                ROADS_FILE
            );


        roadsLayer =
            L.geoJSON(
                roadsData,
                {
                    style:{
                        color:"#16c978",

                        weight:3,

                        opacity:.85
                    }
                }
            );


        roadsLayer.addTo(
            map
        );


        return true;

    }catch(error){

        console.error(
            "ROADS:",
            error
        );

        return false;

    }

}


/* ==========================================
   LOAD PLACES
========================================== */

async function loadPlaces(){

    try{

        placesData =
            await loadJSON(
                PLACES_FILE
            );


        placesLayer =
            L.geoJSON(

                placesData,

                {

                    pointToLayer:
                    function(
                        feature,
                        latlng
                    ){

                        return L.marker(

                            latlng,

                            {

                                icon:
                                L.divIcon({

                                    className:"",

                                    html:
                                    '<div class="place-marker">📍</div>',

                                    iconSize:[
                                        30,
                                        30
                                    ],

                                    iconAnchor:[
                                        15,
                                        15
                                    ]

                                })

                            }

                        );

                    },


                    onEachFeature:
                    function(
                        feature,
                        layer
                    ){

                        const p =
                            feature.properties ||
                            {};


                        const name =
                            p.name ||
                            p["name:ru"] ||
                            p["name:tg"] ||
                            p.amenity ||
                            p.shop ||
                            p.tourism ||
                            "Объект";


                        layer.bindPopup(

                            `
                            <div
                            style="
                            font-family:Arial;
                            font-size:13px;
                            ">

                                <b>
                                    ${escapeHTML(name)}
                                </b>

                            </div>
                            `

                        );

                    }

                }

            );


        return true;

    }catch(error){

        console.error(
            "PLACES:",
            error
        );

        return false;

    }

}


/* ==========================================
   HTML SAFETY
========================================== */

function escapeHTML(
    value
){

    return String(value)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


/* ==========================================
   SHOW ROADS
========================================== */

function showRoads(){

    if(!roadsLayer){

        toast(
            "Дороги ещё загружаются"
        );

        return;

    }


    if(placesLayer){

        map.removeLayer(
            placesLayer
        );

    }


    roadsLayer.addTo(
        map
    );


    setActive(
        "roadsBtn"
    );


    setStatus(
        "Дороги Душанбе",
        "READY"
    );

}


/* ==========================================
   SHOW PLACES
========================================== */

function showPlaces(){

    if(!placesLayer){

        toast(
            "Объекты ещё загружаются"
        );

        return;

    }


    if(roadsLayer){

        map.removeLayer(
            roadsLayer
        );

    }


    placesLayer.addTo(
        map
    );


    setActive(
        "placesBtn"
    );


    setStatus(
        "Объекты Душанбе",
        "READY"
    );

}


/* ==========================================
   BUTTON STATE
========================================== */

function setActive(
    id
){

    document
        .querySelectorAll(
            ".buttons button"
        )
        .forEach(
            button => {

                button.classList.remove(
                    "active"
                );

            }
        );


    document
        .getElementById(
            id
        )
        .classList.add(
            "active"
        );

}


/* ==========================================
   SEARCH
========================================== */

function searchMap(){

    const input =
        document
        .getElementById(
            "search"
        );


    const query =
        input.value
        .trim()
        .toLowerCase();


    if(!query){

        toast(
            "Введите название"
        );

        return;

    }


    let found = null;


    /* PLACES */

    if(
        placesData &&
        Array.isArray(
            placesData.features
        )
    ){

        for(
            const feature
            of placesData.features
        ){

            const properties =
                feature.properties ||
                {};


            const text =
                Object.values(
                    properties
                )
                .join(" ")
                .toLowerCase();


            if(
                text.includes(
                    query
                )
            ){

                found =
                    feature;

                break;

            }

        }

    }


    /* ROADS */

    if(
        !found &&
        roadsData &&
        Array.isArray(
            roadsData.features
        )
    ){

        for(
            const feature
            of roadsData.features
        ){

            const properties =
                feature.properties ||
                {};


            const text =
                Object.values(
                    properties
                )
                .join(" ")
                .toLowerCase();


            if(
                text.includes(
                    query
                )
            ){

                found =
                    feature;

                break;

            }

        }

    }


    if(!found){

        toast(
            "Ничего не найдено"
        );

        return;

    }


    const temporaryLayer =
        L.geoJSON(
            found
        );


    const bounds =
        temporaryLayer.getBounds();


    if(
        bounds &&
        bounds.isValid()
    ){

        map.fitBounds(
            bounds,
            {
                padding:[
                    80,
                    80
                ]
            }
        );

    }


    if(
        found.properties &&
        found.properties.name
    ){

        toast(
            found.properties.name
        );

    }else{

        toast(
            "Объект найден"
        );

    }

}


/* ==========================================
   GPS
========================================== */

function locateMe(){

    if(
        !navigator.geolocation
    ){

        toast(
            "GPS недоступен"
        );

        return;

    }


    toast(
        "Определяем местоположение..."
    );


    navigator.geolocation
    .getCurrentPosition(

        function(position){

            const lat =
                position.coords.latitude;

            const lon =
                position.coords.longitude;


            if(gpsMarker){

                map.removeLayer(
                    gpsMarker
                );

            }


            gpsMarker =
                L.marker(
                    [
                        lat,
                        lon
                    ]
                )
                .addTo(map);


            gpsMarker.bindPopup(
                "📍 Вы здесь"
            )
            .openPopup();


            map.flyTo(
                [
                    lat,
                    lon
                ],
                16,
                {
                    duration:1
                }
            );


            toast(
                "Местоположение найдено"
            );

        },


        function(error){

            console.error(
                "GPS:",
                error
            );


            if(
                error.code === 1
            ){

                toast(
                    "Разрешите доступ к GPS"
                );

            }else{

                toast(
                    "Не удалось определить GPS"
                );

            }

        },


        {

            enableHighAccuracy:true,

            timeout:10000,

            maximumAge:0

        }

    );

}


/* ==========================================
   STATUS
========================================== */

function setStatus(
    text,
    badge
){

    document
        .getElementById(
            "status"
        )
        .textContent =
        text;


    document
        .getElementById(
            "badge"
        )
        .textContent =
        badge;

}


/* ==========================================
   TOAST
========================================== */

let toastTimer = null;


function toast(
    text
){

    const element =
        document
        .getElementById(
            "toast"
        );


    element.textContent =
        text;


    element.classList.add(
        "show"
    );


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(
            function(){

                element.classList.remove(
                    "show"
                );

            },
            2300
        );

}


/* ==========================================
   START
========================================== */

async function start(){

    setStatus(
        "Загрузка данных...",
        "LOAD"
    );


    const results =
        await Promise.all([
            loadRoads(),
            loadPlaces()
        ]);


    const roadsOK =
        results[0];

    const placesOK =
        results[1];


    if(
        roadsOK &&
        placesOK
    ){

        setStatus(
            "Карта готова",
            "READY"
        );

        toast(
            "SHOHIN ROHNAMO готов"
        );

        return;

    }


    if(
        roadsOK &&
        !placesOK
    ){

        setStatus(
            "Дороги загружены",
            "PART"
        );

        toast(
            "Объекты не загрузились"
        );

        return;

    }


    if(
        !roadsOK &&
        placesOK
    ){

        setStatus(
            "Объекты загружены",
            "PART"
        );

        toast(
            "Дороги не загрузились"
        );

        return;

    }


    setStatus(
        "Ошибка загрузки",
        "ERROR"
    );

    toast(
        "Проверь GeoJSON-файлы"
    );

}


start();

</script>

</body>
</html>
