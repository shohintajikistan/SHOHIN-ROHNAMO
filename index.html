<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#087f46">
<title>SHOHIN ROHNAMO</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
:root{
  --green:#087f46;
  --green2:#12a85c;
  --light:#f3f8f4;
  --white:#fff;
  --text:#142019;
  --muted:#748079;
  --blue:#287fe8;
  --cyan:#00a9d8;
  --orange:#f39a28;
  --gold:#d9a72c;
  --shadow:0 12px 35px rgba(0,0,0,.14);
  --radius:20px;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Inter,Arial,sans-serif;
}

body{
  background:#edf4ef;
  color:var(--text);
  overflow:hidden;
}

button,input{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
}

/* LOADER */

#loader{
  position:fixed;
  inset:0;
  z-index:99999;
  background:linear-gradient(145deg,#034c2b,#087f46,#13b866);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  color:white;
  transition:.5s;
}

#loader.hide{
  opacity:0;
  pointer-events:none;
}

.logoBig{
  font-size:52px;
  font-weight:1000;
  letter-spacing:5px;
}

.logoSub{
  font-size:10px;
  letter-spacing:3px;
  margin-top:5px;
  opacity:.8;
}

.loaderLine{
  width:170px;
  height:4px;
  border-radius:10px;
  background:rgba(255,255,255,.3);
  margin-top:24px;
  overflow:hidden;
}

.loaderLine span{
  display:block;
  height:100%;
  width:100%;
  background:white;
  animation:loading 1.2s;
}

@keyframes loading{
  from{width:0}
  to{width:100%}
}

/* MAP */

#map{
  position:fixed;
  inset:0;
  z-index:1;
}

.leaflet-control-attribution{
  font-size:8px!important;
}

/* TOP */

.top{
  position:fixed;
  top:0;
  left:0;
  right:0;
  z-index:1000;
  padding:12px;
  pointer-events:none;
}

.topRow{
  max-width:900px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.brand{
  pointer-events:auto;
  display:flex;
  align-items:center;
  gap:9px;
  background:rgba(255,255,255,.96);
  backdrop-filter:blur(18px);
  padding:7px 11px 7px 7px;
  border-radius:17px;
  box-shadow:var(--shadow);
}

.brandLogo{
  width:40px;
  height:40px;
  border-radius:13px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  font-size:14px;
  font-weight:1000;
  background:linear-gradient(145deg,#056337,#13b866);
}

.brandText b{
  display:block;
  font-size:12px;
}

.brandText small{
  display:block;
  color:#7b867f;
  font-size:7px;
  letter-spacing:1.5px;
  margin-top:3px;
}

.langs{
  pointer-events:auto;
  display:flex;
  gap:3px;
  background:rgba(255,255,255,.95);
  padding:5px;
  border-radius:14px;
  box-shadow:var(--shadow);
}

.langs button{
  padding:7px 8px;
  border-radius:9px;
  background:transparent;
  color:#68756d;
  font-size:10px;
  font-weight:bold;
}

.langs button.active{
  background:var(--green);
  color:white;
}

.menuButton{
  pointer-events:auto;
  width:43px;
  height:43px;
  margin-left:6px;
  border-radius:14px;
  background:white;
  box-shadow:var(--shadow);
  font-size:20px;
}

/* SEARCH AREA */

.searchArea{
  position:fixed;
  top:68px;
  left:12px;
  right:12px;
  z-index:900;
  max-width:900px;
  margin:auto;
}

.searchBox{
  height:54px;
  background:rgba(255,255,255,.97);
  backdrop-filter:blur(18px);
  border-radius:17px;
  box-shadow:var(--shadow);
  display:flex;
  align-items:center;
  padding:0 7px 0 15px;
}

.searchIcon{
  font-size:19px;
  margin-right:8px;
}

#search{
  flex:1;
  border:0;
  outline:0;
  background:transparent;
  color:var(--text);
  font-size:14px;
}

.searchGo{
  width:40px;
  height:40px;
  border-radius:12px;
  background:var(--green);
  color:white;
  font-size:18px;
}

/* CHIPS */

.chips{
  display:flex;
  gap:7px;
  overflow-x:auto;
  padding:8px 1px;
  scrollbar-width:none;
}

.chips::-webkit-scrollbar{
  display:none;
}

.chip{
  flex:none;
  background:rgba(255,255,255,.95);
  border-radius:13px;
  padding:9px 12px;
  box-shadow:0 5px 18px rgba(0,0,0,.08);
  color:#425048;
  font-size:11px;
  font-weight:bold;
}

.chip.hot{
  background:#e7f6ed;
  color:var(--green);
}

/* GPS */

.gps{
  position:fixed;
  z-index:1000;
  right:14px;
  bottom:315px;
  width:50px;
  height:50px;
  border-radius:17px;
  background:white;
  box-shadow:var(--shadow);
  color:var(--green);
  font-size:22px;
}

/* BOTTOM */

.bottom{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:1000;
  pointer-events:none;
  padding:10px;
}

.bottomPanel{
  max-width:700px;
  margin:auto;
  pointer-events:auto;
  background:rgba(255,255,255,.97);
  backdrop-filter:blur(20px);
  border-radius:25px 25px 0 0;
  padding:12px;
  box-shadow:0 -10px 35px rgba(0,0,0,.12);
}

/* QUICK */

.quick{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:7px;
}

.quick button{
  background:#f4f8f5;
  border-radius:14px;
  padding:9px 4px;
  color:#46544c;
  font-size:9px;
  font-weight:bold;
}

.quick button span{
  display:block;
  font-size:19px;
  margin-bottom:3px;
}

/* ROUTE PANEL */

.routePanel{
  display:none;
  margin-bottom:8px;
  background:#f5f9f6;
  border-radius:17px;
  padding:9px;
}

.routePanel.show{
  display:block;
}

.pointRow{
  height:42px;
  display:flex;
  align-items:center;
  gap:8px;
}

.pointIcon{
  width:27px;
  height:27px;
  border-radius:50%;
  display:flex;
  justify-content:center;
  align-items:center;
  color:white;
  font-size:11px;
  font-weight:bold;
}

.pointA{
  background:#12a85c;
}

.pointB{
  background:#e84b4b;
}

.pointInput{
  flex:1;
  border:0;
  outline:0;
  background:transparent;
  font-size:12px;
  min-width:0;
}

.mapChoose{
  padding:7px 9px;
  border-radius:9px;
  background:#e4f3e9;
  color:var(--green);
  font-size:10px;
  font-weight:bold;
}

.transport{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
  margin-top:5px;
}

.transport button{
  padding:10px 4px;
  border-radius:11px;
  font-size:10px;
  font-weight:bold;
  color:#56645b;
  background:white;
}

.transport button.active.car{
  background:var(--green);
  color:white;
}

.transport button.active.foot{
  background:#8a6a35;
  color:white;
}

.transport button.active.bike{
  background:#287fe8;
  color:white;
}

.shadowMode{
  margin-top:7px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px;
  border-radius:12px;
  background:#fff9df;
}

.shadowText b{
  display:block;
  font-size:11px;
}

.shadowText small{
  color:#8b7a42;
  font-size:9px;
}

.switch{
  width:43px;
  height:24px;
  background:#d8ded9;
  border-radius:20px;
  padding:3px;
}

.switch i{
  display:block;
  width:18px;
  height:18px;
  border-radius:50%;
  background:white;
  transition:.2s;
}

.switch.on{
  background:#d6a72d;
}

.switch.on i{
  transform:translateX(19px);
}

.build{
  width:100%;
  margin-top:7px;
  padding:14px;
  border-radius:13px;
  color:white;
  font-size:12px;
  font-weight:900;
  background:linear-gradient(145deg,#06743f,#12a85c);
}

/* ROUTE RESULT */

.routeResult{
  display:none;
  background:white;
  border-radius:18px;
  padding:12px;
  margin-bottom:8px;
  box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.routeResult.show{
  display:block;
}

.routeStats{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.big{
  font-size:22px;
  font-weight:1000;
}

.small{
  font-size:9px;
  color:var(--muted);
}

.routeLine{
  height:5px;
  border-radius:10px;
  margin:10px 0;
  background:linear-gradient(90deg,#12a85c,#d9a72c,#287fe8);
}

.start{
  width:100%;
  padding:13px;
  border-radius:12px;
  background:var(--green);
  color:white;
  font-weight:bold;
}

/* MENU */

.overlay{
  position:fixed;
  inset:0;
  z-index:5000;
  background:rgba(0,0,0,.45);
  display:none;
}

.overlay.show{
  display:block;
}

.drawer{
  position:fixed;
  z-index:6000;
  top:0;
  right:-390px;
  width:360px;
  max-width:91%;
  height:100%;
  background:white;
  padding:14px;
  overflow:auto;
  transition:.3s;
  box-shadow:-15px 0 40px rgba(0,0,0,.22);
}

.drawer.open{
  right:0;
}

.drawerHead{
  padding:21px;
  border-radius:22px;
  color:white;
  background:linear-gradient(145deg,#034c2b,#087f46,#13b866);
  margin-bottom:10px;
}

.drawerHead h1{
  font-size:28px;
}

.drawerHead p{
  font-size:10px;
  opacity:.8;
  margin-top:4px;
}

.closeDrawer{
  float:right;
  width:34px;
  height:34px;
  border-radius:10px;
}

.menuItem{
  width:100%;
  padding:14px;
  border-radius:14px;
  text-align:left;
  background:white;
  color:#25342b;
  font-weight:bold;
  font-size:13px;
  margin:2px 0;
}

.menuItem:hover{
  background:#edf8f1;
}

.menuItem span{
  display:inline-block;
  width:30px;
  font-size:18px;
}

/* PAGES */

.page{
  position:fixed;
  inset:0;
  z-index:4000;
  display:none;
  overflow:auto;
  background:#f0f6f2;
  padding:75px 14px 30px;
}

.page.show{
  display:block;
}

.pageInner{
  max-width:900px;
  margin:auto;
}

.pageHero{
  padding:23px;
  border-radius:23px;
  color:white;
  background:linear-gradient(145deg,#034c2b,#087f46,#13b866);
  margin-bottom:13px;
}

.pageHero h1{
  font-size:26px;
}

.pageHero p{
  margin-top:6px;
  opacity:.85;
  font-size:12px;
}

.card{
  background:white;
  border-radius:19px;
  padding:16px;
  margin-bottom:11px;
  box-shadow:0 6px 25px rgba(0,0,0,.07);
}

.card h3{
  margin-bottom:7px;
}

.muted{
  color:var(--muted);
  font-size:12px;
  line-height:1.55;
}

.badge{
  display:inline-block;
  padding:6px 9px;
  border-radius:9px;
  font-size:10px;
  font-weight:bold;
  margin:3px;
}

.bus{
  background:#e8f0ff;
  color:var(--blue);
}

.trolley{
  background:#e3f9ff;
  color:#008db7;
}

.mini{
  background:#fff1df;
  color:#d77d0b;
}

.primary{
  width:100%;
  padding:13px;
  border-radius:12px;
  color:white;
  background:var(--green);
  font-weight:bold;
}

.placeGrid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:11px;
}

.placeCard{
  background:white;
  border-radius:19px;
  padding:17px;
  box-shadow:0 6px 25px rgba(0,0,0,.07);
}

.placeEmoji{
  font-size:30px;
  margin-bottom:10px;
}

/* MODAL */

.modal{
  position:fixed;
  inset:0;
  z-index:9000;
  display:none;
  align-items:flex-end;
  background:rgba(0,0,0,.5);
  padding:10px;
}

.modal.show{
  display:flex;
}

.modalBox{
  width:700px;
  max-width:100%;
  max-height:90vh;
  overflow:auto;
  background:white;
  border-radius:24px;
  padding:18px;
  margin:auto;
}

.modalHead{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}

.close{
  width:38px;
  height:38px;
  border-radius:11px;
  background:#edf3ef;
}

/* FORMS */

.field{
  margin-bottom:12px;
}

.field label{
  display:block;
  margin-bottom:6px;
  font-size:11px;
  font-weight:bold;
}

.field input,
.field textarea,
.field select{
  width:100%;
  padding:12px;
  border:1px solid #d6e3da;
  border-radius:12px;
  outline:0;
  background:white;
}

.field textarea{
  min-height:100px;
}

/* DARK */

body.dark{
  background:#07110b;
  color:#fff;
}

body.dark .brand,
body.dark .langs,
body.dark .menuButton,
body.dark .searchBox,
body.dark .chip,
body.dark .bottomPanel,
body.dark .gps{
  background:#142219;
  color:white;
}

body.dark #search{
  color:white;
}

body.dark .bottomPanel{
  background:rgba(20,34,25,.97);
}

body.dark .quick button,
body.dark .routePanel,
body.dark .transport button{
  background:#1a2b20;
  color:white;
}

body.dark .routeResult,
body.dark .drawer,
body.dark .card,
body.dark .placeCard,
body.dark .modalBox{
  background:#142219;
  color:white;
}

body.dark .menuItem{
  background:#142219;
  color:white;
}

body.dark .page{
  background:#07110b;
}

body.dark .field input,
body.dark .field textarea,
body.dark .field select{
  background:#1a2b20;
  color:white;
  border-color:#294332;
}

@media(max-width:600px){

  .brandText{
    display:none;
  }

  .langs button{
    padding:7px 6px;
  }

  .gps{
    bottom:315px;
  }

}

@media(min-width:800px){

  .bottom{
    bottom:20px;
  }

  .bottomPanel{
    border-radius:24px;
  }

  .gps{
    bottom:330px;
  }

}
</style>
</head>

<body>

<!-- LOADER -->

<div id="loader">
  <div class="logoBig">SHT</div>
  <div class="logoSub">SHOHIN ROHNAMO</div>
  <div class="loaderLine"><span></span></div>
</div>

<!-- MAP -->

<div id="map"></div>

<!-- TOP -->

<div class="top">

  <div class="topRow">

    <div class="brand">
      <div class="brandLogo">SHT</div>

      <div class="brandText">
        <b>SHOHIN ROHNAMO</b>
        <small>DUShANBE NAVIGATION</small>
      </div>
    </div>

    <div style="display:flex;align-items:center">

      <div class="langs">

        <button id="tg" onclick="setLanguage('tg')">
          TJ
        </button>

        <button id="ru" class="active"
        onclick="setLanguage('ru')">
          RU
        </button>

        <button id="en"
        onclick="setLanguage('en')">
          EN
        </button>

      </div>

      <button class="menuButton"
      onclick="openMenu()">
        ☰
      </button>

    </div>

  </div>

</div>

<!-- SEARCH -->

<div class="searchArea">

  <div class="searchBox">

    <span class="searchIcon">🔎</span>

    <input
      id="search"
      placeholder="Куда едем?"
      onkeydown="
      if(event.key==='Enter')searchPlace()
      ">

    <button class="searchGo"
    onclick="searchPlace()">
      ➜
    </button>

  </div>

  <div class="chips">

    <button class="chip hot"
    onclick="popular('Садбарг')">
      🔥 Садбарг
    </button>

    <button class="chip"
    onclick="popular('Корвон')">
      🛍️ Корвон
    </button>

    <button class="chip"
    onclick="popular('Караболо')">
      🏥 Караболо
    </button>

    <button class="chip"
    onclick="popular('Цирк')">
      🎪 Цирк
    </button>

    <button class="chip"
    onclick="popular('Пединститут')">
      🎓 Пединститут
    </button>

    <button class="chip"
    onclick="popular('Аэропорт')">
      ✈️ Аэропорт
    </button>

    <button class="chip"
    onclick="popular('Вокзал')">
      🚉 Вокзал
    </button>

  </div>

</div>

<!-- GPS -->

<button class="gps" onclick="getGPS()">
  ⦿
</button>

<!-- BOTTOM -->

<div class="bottom">

  <div class="bottomPanel">

    <!-- ROUTE -->

    <div id="routePanel" class="routePanel">

      <div class="pointRow">

        <div class="pointIcon pointA">
          A
        </div>

        <input
          id="inputA"
          class="pointInput"
          readonly
          placeholder="Откуда?">

        <button
          class="mapChoose"
          onclick="chooseA()">
          Карта
        </button>

      </div>

      <div class="pointRow">

        <div class="pointIcon pointB">
          B
        </div>

        <input
          id="inputB"
          class="pointInput"
          readonly
          placeholder="Куда?">

        <button
          class="mapChoose"
          onclick="chooseB()">
          Карта
        </button>

      </div>

      <div class="transport">

        <button
          id="car"
          class="active car"
          onclick="transport('car')">
          🚗 Авто
        </button>

        <button
          id="foot"
          class="foot"
          onclick="transport('foot')">
          🚶 Пешком
        </button>

        <button
          id="bike"
          class="bike"
          onclick="transport('bike')">
          🚲 Велосипед
        </button>

      </div>

      <div class="shadowMode"
      onclick="toggleShadow()">

        <div class="shadowText">
          <b>🌳 Маршрут в тени</b>
          <small>Пешеходный режим</small>
        </div>

        <div id="shadowSwitch"
        class="switch">
          <i></i>
        </div>

      </div>

      <button class="build"
      onclick="buildRoute()">
        🧭 ПОСТРОИТЬ МАРШРУТ
      </button>

    </div>

    <!-- RESULT -->

    <div id="routeResult"
    class="routeResult">

      <div class="routeStats">

        <div>
          <div id="routeTime"
          class="big">
            --
          </div>

          <div class="small">
            ВРЕМЯ В ПУТИ
          </div>
        </div>

        <div style="text-align:right">

          <div id="routeDistance"
          class="big">
            --
          </div>

          <div class="small">
            РАССТОЯНИЕ
          </div>

        </div>

      </div>

      <div class="routeLine"></div>

      <button class="start"
      onclick="startNavigation()">
        ▶ НАЧАТЬ НАВИГАЦИЮ
      </button>

    </div>

    <!-- QUICK -->

    <div class="quick">

      <button onclick="openRouteMode()">
        <span>🧭</span>
        Маршрут
      </button>

      <button onclick="openStops()">
        <span>🚏</span>
        Остановки
      </button>

      <button onclick="openPlaces()">
        <span>🏙️</span>
        Душанбе
      </button>

      <button onclick="openRoutes()">
        <span>🚌</span>
        Роҳҳо
      </button>

    </div>

  </div>

</div>

<!-- DRAWER -->

<div id="overlay"
class="overlay"
onclick="closeMenu()">
</div>

<aside id="drawer" class="drawer">

  <div class="drawerHead">

    <button class="closeDrawer"
    onclick="closeMenu()">
      ✕
    </button>

    <h1>SHT</h1>

    <p>
      SHOHIN ROHNAMO
    </p>

  </div>

  <button class="menuItem"
  onclick="goHome()">
    <span>🏠</span>
    Главная
  </button>

  <button class="menuItem"
  onclick="openRouteMode()">
    <span>🧭</span>
    Навигация
  </button>

  <button class="menuItem"
  onclick="openRoutes()">
    <span>🚌</span>
    Маршруты
  </button>

  <button class="menuItem"
  onclick="openStops()">
    <span>🚏</span>
    Остановки
  </button>

  <button class="menuItem"
  onclick="openPlaces()">

/* ==================================

function transport(type){

  currentTransport=type;

  ["car","foot","bike"].forEach(id=>{
    document.getElementById(id)
      .classList.remove("active");
  });

  document.getElementById(type)
    .classList.add("active");

  }

}

================================== */

function toggleShadow(){

    .classList.toggle(

  if(shadowMode){

    transport("foot");

    alert(
      "🌳 Режим «Маршрут в тени» включён. В этой версии пеший маршрут использует дорожную сеть; реальные теневые участки будут добавлены после подключения данных о деревьях и парках."
    );

  }

}


/* ==================================
   REAL ROAD ROUTE
================================== */

async function buildRoute(){

  if(!A || !B){

    alert(
      "Сначала выберите точки A и B."
    );

    return;
  }

  let profile="driving";

  if(currentTransport==="foot")
    profile="foot";

  if(currentTransport==="bike")
    profile="cycling";

  const url=
    "https://router.project-osrm.org/route/v1/"+
    profile+"/"+
    A.lng+","+A.lat+";"+
    B.lng+","+B.lat+
    "?overview=full&geometries=geojson&steps=true";

  const result=
    document.getElementById("routeResult");

  result.classList.add("show");

  document.getElementById("routeTime")
    .textContent="...";

  document.getElementById("routeDistance")
    .textContent="...";

  try{

    const response=await fetch(url);

    if(!response.ok)
      throw new Error();

    const data=await response.json();

    if(data.code!=="Ok")
      throw new Error();

    const r=data.routes[0];

    if(routeLayer)
      map.removeLayer(routeLayer);

    routeLayer=L.geoJSON(
      r.geometry,
      {
        style:{
          color:shadowMode
            ? "#b58a24"
            : "#087f46",
          weight:7,
          opacity:.95
        }
      }
    ).addTo(map);

    map.fitBounds(
      routeLayer.getBounds(),
      {
        padding:[80,100]
      }
    );

    const distance=
      (r.distance/1000).toFixed(1);

    const minutes=
      Math.max(
        1,
        Math.round(r.duration/60)
      );

    document.getElementById("routeDistance")
      .textContent=
        distance+" км";

    document.getElementById("routeTime")
      .textContent=
        minutes+" мин";

  }catch(error){

    document.getElementById("routeTime")
      .textContent="Ошибка";

    document.getElementById("routeDistance")
      .textContent="—";

    alert(
      "Маршрут не найден. Проверьте интернет и попробуйте снова."
    );

  }

}

   GPS
================================== */

function getGPS(){

  if(!navigator.geolocation){

    alert("GPS не поддерживается.");
    return;

  }

  navigator.geolocation.getCurrentPosition(
    position=>{

      const pos={
        lat:position.coords.latitude,
        lng:position.coords.longitude
      };

      map.setView(
        [pos.lat,pos.lng],
        16
      );

      L.marker(pos)
        .addTo(map)
        .bindPopup("📍 Вы здесь")
        .openPopup();

    },
    ()=>{
      alert(
        "Разрешите доступ к геолокации."
      );
    },
    {
      enableHighAccuracy:true,
      timeout:10000
    }
  );

}

      .bindPopup("📍 Новая остановка")
      .openPopup();

});


function saveNewStop(){

  if(!newStop){

    alert(
      "Сначала выберите место на карте."
    );

    return;
  }

  const name=
    document.getElementById("newName")
      .value.trim();

  if(!name){

    alert(
      "Введите название остановки."
    );

    return;
  }

  const item={
    name:name,
    lat:newStop.lat,
    lng:newStop.lng,
    buses:
      document.getElementById("newBus").value,
    trolley:
      document.getElementById("newTrolley").value,
    mini:
      document.getElementById("newMini").value
  };

  const list=
    JSON.parse(
      localStorage.getItem(
        "SHOHIN_STOP_SUGGESTIONS"
      ) || "[]"
    );

  list.push(item);

  localStorage.setItem(
    "SHOHIN_STOP_SUGGESTIONS",
    JSON.stringify(list)
  );

  alert(
    "Остановка сохранена как предложение для обновления базы."
  );

  newStop=null;

  closePage();

}

/* ==================================
   LANGUAGE
================================== */

function setLanguage(lang){

  ["tg","ru","en"].forEach(x=>{
    document.getElementById(x)
      .classList.remove("active");
  });

  document.getElementById(lang)
    .classList.add("active");

  const search=
    document.getElementById("search");

  if(lang==="tg")
    search.placeholder=
      "Ба куҷо меравем?";

  if(lang==="ru")
    search.placeholder=
      "Куда едем?";

  if(lang==="en")
    search.placeholder=
      "Where are we going?";

}


/* ==================================
   DARK
================================== */

function toggleDark(){

  document.body.classList.toggle("dark");

  localStorage.setItem(
    "SHOHIN_DARK",
    document.body.classList.contains("dark")
  );

}


/* ==================================
   START NAVIGATION
================================== */

function startNavigation(){

  if(!A || !B){

    alert(
      "Сначала выберите A и B."
    );

    return;
  }

  if(!routeLayer){

    buildRoute();
    return;

  }

  alert(
    "🧭 Навигация запущена. Следуйте по зелёному маршруту."
  );

}


/* ==================================
   LOADER
================================== */

window.addEventListener(
  "load",
  ()=>{

    if(
      localStorage.getItem("SHOHIN_DARK")
      ==="true"
    ){

      document.body.classList.add("dark");

    }

    setTimeout(
      ()=>{
        document
          .getElementById("loader")
          .classList.add("hide");
      },
      900
    );

  }
);
