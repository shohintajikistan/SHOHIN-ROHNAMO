<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>SHOHIN ROHNAMO</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body,#map{
    width:100%;
    height:100%;
}

body{
    overflow:hidden;
    font-family:Arial,sans-serif;
    background:#06120b;
}

#map{
    position:fixed;
    inset:0;
    z-index:1;
}

/* TOP */

.top{
    position:fixed;
    top:12px;
    left:12px;
    right:12px;
    z-index:1000;
    display:flex;
    gap:8px;
}

.logo{
    width:48px;
    height:48px;
    flex:none;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:16px;

    background:linear-gradient(
        145deg,
        #62ffab,
        #0a9b57
    );

    color:#031008;

    font-size:22px;
    font-weight:900;

    box-shadow:0 8px 30px rgba(0,0,0,.4);
}

.search{
    flex:1;

    height:48px;

    display:flex;
    align-items:center;

    padding:5px 6px 5px 14px;

    background:rgba(5,15,9,.94);

    border:1px solid rgba(255,255,255,.1);

    border-radius:16px;

    backdrop-filter:blur(20px);
}

.search input{
    flex:1;
    min-width:0;

    border:0;
    outline:0;

    background:transparent;

    color:#fff;

    font-size:12px;
}

.search input::placeholder{
    color:#7b8980;
}

.search button{
    width:38px;
    height:38px;

    border:0;
    border-radius:12px;

    background:#39df89;

    color:#031008;

    font-size:17px;
}

/* PANEL */

.panel{
    position:fixed;

    top:70px;
    left:12px;
    right:12px;

    z-index:1000;

    padding:12px;

    background:rgba(5,15,9,.95);

    border:1px solid rgba(255,255,255,.1);

    border-radius:20px;

    backdrop-filter:blur(20px);

    box-shadow:0 10px 40px rgba(0,0,0,.3);
}

.status{
    display:flex;
    align-items:center;
    gap:10px;
}

.status-icon{
    width:38px;
    height:38px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:13px;

    background:#12331f;

    font-size:18px;
}

.status-text{
    flex:1;
}

.status-text small{
    display:block;

    color:#718078;

    font-size:7px;

    letter-spacing:1px;
}

.status-text strong{
    display:block;

    margin-top:4px;

    color:white;

    font-size:11px;
}

.badge{
    padding:8px 10px;

    border-radius:11px;

    background:#12331f;

    color:#39df89;

    font-size:7px;

    font-weight:bold;
}

/* BUTTONS */

.buttons{
    margin-top:10px;

    display:flex;
    gap:7px;
}

.buttons button{
    flex:1;

    padding:10px 6px;

    border:1px solid rgba(255,255,255,.08);

    border-radius:12px;

    background:#0d1d12;

    color:#aebbb3;

    font-size:9px;

    font-weight:bold;
}

.buttons button.active{
    background:#39df89;
    color:#031008;
}

/* GPS */

.gps{
    position:fixed;

    right:13px;
    bottom:90px;

    z-index:1000;

    width:52px;
    height:52px;

    border:1px solid rgba(255,255,255,.1);

    border-radius:17px;

    background:rgba(5,15,9,.95);

    color:#39df89;

    font-size:24px;

    box-shadow:0 8px 25px rgba(0,0,0,.3);
}

/* BOTTOM */

.bottom{
    position:fixed;

    left:12px;
    right:12px;
    bottom:12px;

    z-index:1000;

    padding:12px;

    border-radius:20px;

    background:rgba(5,15,9,.95);

    border:1px solid rgba(255,255,255,.1);

    backdrop-filter:blur(20px);
}

.bottom-text{
    color:#8d9b93;
    font-size:8px;
}

.bottom-text b{
    color:#39df89;
}

/* TOAST */

#toast{
    position:fixed;

    top:190px;
    left:50%;

    z-index:9999;

    transform:translate(-50%,-10px);

    opacity:0;

    padding:10px 15px;

    border-radius:13px;

    background:#effff5;

    color:#031008;

    font-size:9px;

    font-weight:bold;

    pointer-events:none;

    transition:.25s;
}

#toast.show{
    opacity:1;
    transform:translate(-50%,0);
}

/* LEAFLET */

.leaflet-control-zoom{
    margin-top:360px!important;
}

.leaflet-control-zoom a{
    background:rgba(5,15,9,.95)!important;
    color:#39df89!important;
    border:0!important;
}

.leaflet-control-attribution{
    background:rgba(5,15,9,.7)!important;
    color:#aaa!important;
    font-size:7px!important;
}

.leaflet-control-attribution a{
    color:#39df89!important;
}

/* MOBILE */

@media(max-width:600px){

    .panel{
        top:70px;
    }

}
</style>
</head>

<body>

<div id="map"></div>

<!-- TOP -->

<div class="top">

    <div class="logo">
        S
    </div>

    <div class="search">

        <input
            id="search"
            placeholder="Найти дорогу..."
        >

        <button onclick="searchMap()">
            🔎
        </button>

    </div>

</div>


<!-- PANEL -->

<div class="panel">

    <div class="status">

        <div class="status-icon">
            🗺️
        </div>

        <div class="status-text">

            <small>
                SHOHIN ROHNAMO
            </small>

            <strong id="statusText">
                Загрузка карты...
            </strong>

        </div>

        <div
            class="badge"
            id="badge">

            LOAD

        </div>

    </div>


    <div class="buttons">

        <button
            class="active"
            onclick="showRoads()">

            🛣️ ДОРОГИ

        </button>

        <button
            onclick="locateMe()">

            📍 GPS

        </button>

        <button
            onclick="resetMap()">

            🗺️ ОБЗОР

        </button>

    </div>

</div>


<!-- GPS -->

<button
    class="gps"
    onclick="locateMe()">

    ◎

</button>


<!-- BOTTOM -->

<div class="bottom">

    <div class="bottom-text">

        <b>SHOHIN GREEN</b>
        • DUSHANBE
        • OFFLINE MAP

    </div>

</div>


<div id="toast">
    Готово
</div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* ==========================================
   MAP
========================================== */

const DUSHANBE = [
    38.5598,
    68.7870
];

const map = L.map(
    "map",
    {
        center:DUSHANBE,
        zoom:13,
        minZoom:10,
        maxZoom:19
    }
);


/* ==========================================
   BASE MAP
========================================== */

const baseMap = L.tileLayer(

    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

    {
        maxZoom:19,
        attribution:
        "&copy; OpenStreetMap contributors"
    }

).addTo(map);


/* ==========================================
   VARIABLES
========================================== */

let geoLayer = null;

let originalData = null;

let currentGPS = null;


/* ==========================================
   LOAD GEOJSON
========================================== */

async function loadGeoJSON(){

    setStatus(
        "Загрузка дорог...",
        "LOAD"
    );

    try{

        const response =
            await fetch(
                "export(1).geojson"
            );

        if(!response.ok){

            throw new Error(
                "HTTP " +
                response.status
            );

        }

        const data =
            await response.json();

        originalData = data;

        showGeoJSON(data);

        setStatus(
            "Дороги загружены",
            "READY"
        );

        toast(
            "GeoJSON успешно загружен"
        );

    }catch(error){

        console.error(error);

        setStatus(
            "Ошибка загрузки GeoJSON",
            "ERROR"
        );

        toast(
            "Не удалось загрузить GeoJSON"
        );

    }

}


/* ==========================================
   SHOW GEOJSON
========================================== */

function showGeoJSON(data){

    if(geoLayer){

        map.removeLayer(
            geoLayer
        );

    }

    geoLayer =
        L.geoJSON(

            data,

            {

                style:function(){

                    return {

                        color:"#16c978",

                        weight:3,

                        opacity:.9

                    };

                },

                onEachFeature:function(
                    feature,
                    layer
                ){

                    let name = "";

                    if(
                        feature.properties
                    ){

                        name =
                            feature.properties.name ||
                            feature.properties.ref ||
                            feature.properties.highway ||
                            "";

                    }

                    if(name){

                        layer.bindPopup(
                            "<b>" +
                            name +
                            "</b>"
                        );

                    }

                }

            }

        ).addTo(map);


    const bounds =
        geoLayer.getBounds();


    if(bounds.isValid()){

        map.fitBounds(
            bounds,
            {
                padding:[
                    40,
                    40
                ]
            }
        );

    }

}


/* ==========================================
   ROADS
========================================== */

function showRoads(){

    if(!originalData){

        toast(
            "Карта ещё загружается"
        );

        return;
    }

    showGeoJSON(
        originalData
    );

    setStatus(
        "Дороги Душанбе",
        "READY"
    );

}


/* ==========================================
   SEARCH
========================================== */

function searchMap(){

    const query =
        document
        .getElementById(
            "search"
        )
        .value
        .trim()
        .toLowerCase();


    if(!query){

        toast(
            "Введите название"
        );

        return;
    }


    if(!originalData){

        toast(
            "Данные ещё загружаются"
        );

        return;
    }


    let found = null;


    for(
        const feature
        of originalData.features || []
    ){

        const props =
            feature.properties || {};


        const text =
            Object.values(props)
            .join(" ")
            .toLowerCase();


        if(
            text.includes(
                query
            )
        ){

            found =
                feature;

            break;

        }

    }


    if(!found){

        toast(
            "Ничего не найдено"
        );

        return;
    }


    const temp =
        L.geoJSON(
            found
        );


    const bounds =
        temp.getBounds();


    if(bounds.isValid()){

        map.fitBounds(
            bounds,
            {
                padding:[
                    80,
                    80
                ]
            }
        );

    }


    toast(
        "Найдено"
    );

}


/* ==========================================
   GPS
========================================== */

function locateMe(){

    if(
        !navigator.geolocation
    ){

        toast(
            "GPS недоступен"
        );

        return;
    }


    toast(
        "Определяем местоположение..."
    );


    navigator.geolocation
    .getCurrentPosition(

        function(position){

            const lat =
                position.coords.latitude;

            const lon =
                position.coords.longitude;


            currentGPS =
                L.marker(
                    [
                        lat,
                        lon
                    ],
                    {
                        title:
                        "Вы здесь"
                    }
                )
                .addTo(map);


            currentGPS
                .bindPopup(
                    "📍 Вы здесь"
                )
                .openPopup();


            map.flyTo(
                [
                    lat,
                    lon
                ],
                16,
                {
                    duration:1
                }
            );


            toast(
                "GPS найден"
            );

        },

        function(){

            toast(
                "Разрешите доступ к GPS"
            );

        },

        {

            enableHighAccuracy:true,

            timeout:10000,

            maximumAge:0

        }

    );

}


/* ==========================================
   RESET
========================================== */

function resetMap(){

    map.flyTo(
        DUSHANBE,
        13,
        {
            duration:1
        }
    );

}


/* ==========================================
   STATUS
========================================== */

function setStatus(
    text,
    badge
){

    document
        .getElementById(
            "statusText"
        )
        .textContent =
        text;


    document
        .getElementById(
            "badge"
        )
        .textContent =
        badge;

}


/* ==========================================
   TOAST
========================================== */

let toastTimer;


function toast(
    text
){

    const el =
        document
        .getElementById(
            "toast"
        );


    el.textContent =
        text;


    el.classList.add(
        "show"
    );


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(
            function(){

                el.classList.remove(
                    "show"
                );

            },
            2300
        );

}


/* ==========================================
   START
========================================== */

loadGeoJSON();

</script>

</body>
      </html>
